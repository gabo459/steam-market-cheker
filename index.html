<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valuador de Inventario Steam - Soles Peruanos (S/.)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #171a21;
      color: #c6d4df;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: #66c0f4;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    header p {
      color: #8f98a0;
      font-size: 0.95rem;
    }

    /* Panel de Búsqueda y Filtros */
    .search-panel {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-end;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 180px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: #66c0f4;
      font-weight: bold;
    }

    input, select {
      background-color: #0d121a;
      border: 1px solid #2a475e;
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 5px;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      border-color: #66c0f4;
    }

    button {
      background: linear-gradient(90deg, #47bfff 0%, #1a9fff 100%);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
      height: 42px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #2a475e;
      cursor: not-allowed;
      color: #8f98a0;
    }

    /* Resumen Financiero */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .summary-card {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 18px;
      text-align: center;
    }

    .summary-card h3 {
      font-size: 0.85rem;
      color: #8f98a0;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .summary-card .value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #a3e035;
    }

    /* Caja de Estado */
    .status-box {
      background-color: #0d121a;
      border: 1px dashed #2a475e;
      padding: 12px 18px;
      border-radius: 6px;
      margin-bottom: 25px;
      font-size: 0.9rem;
      color: #66c0f4;
      display: none;
    }

    /* Grilla de Objetos */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .item-card {
      background-color: #1b2838;
      border: 1px solid #2a475e;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .item-card:hover {
      transform: translateY(-3px);
      border-color: #66c0f4;
    }

    .item-rank {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: #171a21;
      border: 1px solid #2a475e;
      color: #66c0f4;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .item-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: #2a475e;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .item-img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    .item-name {
      font-size: 0.85rem;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.2;
      height: 32px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .item-price {
      font-size: 1rem;
      font-weight: bold;
      color: #a3e035;
      margin-top: auto;
    }

    .item-subprice {
      font-size: 0.7rem;
      color: #8f98a0;
      margin-top: 3px;
    }

    .item-total {
      font-size: 0.75rem;
      color: #66c0f4;
      font-weight: bold;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🇵🇪 Valuador de Inventario Steam</h1>
      <p>Calcula el valor en Soles Peruanos (S/.) ordenado de mayor a menor precio</p>
    </header>

    <div class="search-panel">
      <div class="input-group">
        <label for="steamId">Perfil de Steam (URL, usuario o ID):</label>
        <input type="text" id="steamId" placeholder="Ej: gabo459, 76561198... o URL completa">
      </div>

      <div class="input-group">
        <label for="gameSelect">Juego / Categoría:</label>
        <select id="gameSelect">
          <option value="570,2">Dota 2</option>
          <option value="730,2">Counter-Strike 2 (CS2)</option>
          <option value="440,2">Team Fortress 2</option>
          <option value="753,6">Steam (Cromos y Objetos)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="topLimitSelect">Mostrar en pantalla:</label>
        <select id="topLimitSelect" onchange="updateDisplayGrid()">
          <option value="10">Top 10 más caros</option>
          <option value="25" selected>Top 25 más caros</option>
          <option value="50">Top 50 más caros</option>
          <option value="100">Top 100 más caros</option>
          <option value="250">Top 250 más caros</option>
          <option value="2000">Todos (Hasta 2000)</option>
        </select>
      </div>

      <button id="btnFetch" onclick="startValuation()">Consultar Inventario</button>
    </div>

    <div class="status-box" id="statusBox">Esperando consulta...</div>

    <div class="summary-grid">
      <div class="summary-card">
        <h3>Total de Objetos</h3>
        <div class="value" id="totalItems" style="color: #66c0f4;">0</div>
      </div>
      <div class="summary-card">
        <h3>Objetos Comerciables</h3>
        <div class="value" id="marketableItems" style="color: #ffffff;">0</div>
      </div>
      <div class="summary-card">
        <h3>Valor Total Estimado</h3>
        <div class="value" id="totalValue">S/. 0.00</div>
      </div>
    </div>

    <div class="inventory-grid" id="inventoryGrid"></div>
  </div>

  <script>
    // URL base de tu Cloudflare Worker
    const WORKER_BASE_URL = "https://market-steam.ernestoygabo.workers.dev".replace(/\/$/, "");

    let currentItemsList = [];

    // Extracción ultra-robusta de montos numéricos
    function parseSteamPrice(priceStr) {
      if (!priceStr) return 0;
      
      // Busca la secuencia numérica ignorando cualquier símbolo o espacio corrupto
      const match = priceStr.match(/(\d+[\d.,]*)/);
      if (!match) return 0;

      let numStr = match[1];

      if (numStr.includes(',') && numStr.includes('.')) {
        if (numStr.indexOf(',') < numStr.indexOf('.')) {
          numStr = numStr.replace(/,/g, '');
        } else {
          numStr = numStr.replace(/\./g, '').replace(',', '.');
        }
      } else if (numStr.includes(',')) {
        numStr = numStr.replace(',', '.');
      }

      return parseFloat(numStr) || 0;
    }

    async function resolveSteamId64(input) {
      let cleaned = input.trim();

      if (/^\d{17}$/.test(cleaned)) return cleaned;

      const profileMatch = cleaned.match(/steamcommunity\.com\/profiles\/(\d{17})/);
      if (profileMatch) return profileMatch[1];

      let customName = cleaned
        .split('?')[0]
        .replace(/https?:\/\/steamcommunity\.com\/id\//, '')
        .replace(/\//g, '')
        .trim();

      if (!customName) return null;

      const vanityApiUrl = `${WORKER_BASE_URL}/?vanityurl=${encodeURIComponent(customName)}`;
      const response = await fetch(vanityApiUrl);

      if (!response.ok) {
        throw new Error(`Error HTTP ${response.status} al resolver la URL del usuario.`);
      }

      const data = await response.json();

      if (data.response && data.response.success === 1) {
        return data.response.steamid;
      } else {
        throw new Error(`No se pudo resolver el usuario '${customName}'. Verifica que esté bien escrito.`);
      }
    }

    async function startValuation() {
      let rawInput = document.getElementById('steamId').value.trim();
      const gameVal = document.getElementById('gameSelect').value.split(',');
      const appId = gameVal[0];
      const contextId = gameVal[1];

      const btn = document.getElementById('btnFetch');
      const statusBox = document.getElementById('statusBox');

      if (!rawInput) {
        alert("Por favor ingresa un usuario, enlace o SteamID64.");
        return;
      }

      currentItemsList = [];
      document.getElementById('inventoryGrid').innerHTML = '';
      document.getElementById('totalItems').textContent = '0';
      document.getElementById('marketableItems').textContent = '0';
      document.getElementById('totalValue').textContent = 'S/. 0.00';
      
      btn.disabled = true;
      statusBox.style.display = 'block';
      statusBox.textContent = '🔍 Identificando usuario en Steam...';

      try {
        const steamId = await resolveSteamId64(rawInput);
        statusBox.textContent = `⏳ Usuario verificado (${steamId}). Cargando inventario...`;

        const steamUrl = `https://steamcommunity.com/inventory/${steamId}/${appId}/${contextId}?l=spanish&count=2000`;
        const invUrl = `${WORKER_BASE_URL}/?url=${encodeURIComponent(steamUrl)}`;
        const invRes = await fetch(invUrl);

        if (!invRes.ok) {
          throw new Error(`Error HTTP ${invRes.status}: Revisa que tu inventario sea público en la configuración de privacidad de Steam.`);
        }

        const invData = await invRes.json();
        
        if (!invData.assets || invData.assets.length === 0) {
          statusBox.textContent = '⚠️ Este usuario no posee objetos en esta categoría o su inventario es privado.';
          btn.disabled = false;
          return;
        }

        const assets = invData.assets;
        const descriptions = invData.descriptions;

        const descMap = {};
        descriptions.forEach(d => {
          descMap[`${d.classid}_${d.instanceid || '0'}`] = d;
        });

        const itemGroups = {};
        let totalMarketableCount = 0;

        assets.forEach(asset => {
          const key = `${asset.classid}_${asset.instanceid || '0'}`;
          const desc = descMap[key];

          if (desc && desc.marketable === 1) {
            const hashName = desc.market_hash_name;
            totalMarketableCount++;

            if (!itemGroups[hashName]) {
              itemGroups[hashName] = {
                name: desc.name,
                hashName: hashName,
                icon: desc.icon_url,
                count: 1,
                pricePEN: 0,
                lowestVal: 0,
                medianVal: 0
              };
            } else {
              itemGroups[hashName].count++;
            }
          }
        });

        document.getElementById('totalItems').textContent = assets.length;
        document.getElementById('marketableItems').textContent = totalMarketableCount;

        currentItemsList = Object.values(itemGroups);
        statusBox.textContent = `📦 Inventario cargado. Consultando mercado para ${currentItemsList.length} objetos únicos (S/.)...`;

        let processedCount = 0;

        for (const item of currentItemsList) {
          processedCount++;
          statusBox.textContent = `⏳ Precios (${processedCount}/${currentItemsList.length}): Consultando ${item.name}...`;

          const marketUrl = `https://steamcommunity.com/market/priceoverview/?currency=35&appid=${appId}&market_hash_name=${encodeURIComponent(item.hashName)}`;
          const priceUrl = `${WORKER_BASE_URL}/?url=${encodeURIComponent(marketUrl)}`;
          
          try {
            const priceRes = await fetch(priceUrl);
            if (priceRes.ok) {
              const priceData = await priceRes.json();
              if (priceData.success) {
                const lowest = parseSteamPrice(priceData.lowest_price);
                const median = parseSteamPrice(priceData.median_price);

                item.lowestVal = lowest;
                item.medianVal = median;
                // Tomar el valor más alto disponible para reflejar el precio pico reciente
                item.pricePEN = Math.max(lowest, median) || lowest || median || 0;
              }
            }
          } catch (e) {
            console.warn(`No se pudo obtener el precio para ${item.hashName}`);
          }

          // Recalcular el total acumulado con los precios válidos
          const grandTotal = currentItemsList.reduce((acc, i) => acc + (i.pricePEN * i.count), 0);
          document.getElementById('totalValue').textContent = `S/. ${grandTotal.toFixed(2)}`;

          // Reordenar en vivo de mayor a menor a medida que entran los precios
          updateDisplayGrid();

          await new Promise(r => setTimeout(r, 1000));
        }

        const finalTotal = currentItemsList.reduce((acc, i) => acc + (i.pricePEN * i.count), 0);
        statusBox.textContent = `✅ ¡Proceso completado! Valor total estimado: S/. ${finalTotal.toFixed(2)}`;

      } catch (err) {
        statusBox.textContent = `❌ Error: ${err.message}`;
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    }

    function updateDisplayGrid() {
      const grid = document.getElementById('inventoryGrid');
      const limit = parseInt(document.getElementById('topLimitSelect').value, 10) || 25;

      grid.innerHTML = '';

      // Ordenar la lista de mayor a menor valor unitario
      const sortedItems = [...currentItemsList].sort((a, b) => b.pricePEN - a.pricePEN);
      const itemsToDisplay = sortedItems.slice(0, limit);

      itemsToDisplay.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'item-card';

        const imgUrl = `https://community.akamai.steamstatic.com/economy/image/${item.icon}/120fx120f`;
        const totalPrice = (item.pricePEN * item.count).toFixed(2);

        card.innerHTML = `
          <div class="item-rank">#${index + 1}</div>
          ${item.count > 1 ? `<div class="item-badge">x${item.count}</div>` : ''}
          <img class="item-img" src="${imgUrl}" alt="${item.name}">
          <div class="item-name" title="${item.name}">${item.name}</div>
          <div class="item-price">S/. ${item.pricePEN.toFixed(2)}</div>
          <div class="item-subprice" title="Precio Mínimo / Precio Mediano">
            Min: S/. ${item.lowestVal.toFixed(2)} | Med: S/. ${item.medianVal.toFixed(2)}
          </div>
          ${item.count > 1 ? `<div class="item-total">Total: S/. ${totalPrice}</div>` : ''}
        `;

        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
